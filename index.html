<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sa ditë në Zvicër?</title>
<meta name="description" content="Llogaritësi 90/180 Kosovë → Zvicër · Calculateur 90/180 Kosovo → Suisse">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sa ditë">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d52b1e'/%3E%3Crect x='13' y='6' width='6' height='20' fill='%23fff'/%3E%3Crect x='6' y='13' width='20' height='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f8; --card: #fff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --green: #16a34a; --orange: #ea580c; --red: #dc2626; --blue: #2563eb; --dark: #0f172a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 17px; line-height: 1.45; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 1.35rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .lang button { border: 1px solid var(--line); background: var(--card); padding: 6px 10px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: .9rem; }
  .lang button.on { background: var(--dark); color: #fff; border-color: var(--dark); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .ring { display: flex; flex-direction: column; align-items: center; }
  .ring .big { font-size: 5rem; font-weight: 800; line-height: 1; }
  .ring .sub { color: var(--muted); font-weight: 600; margin-top: 2px; }
  .ring .used { margin-top: 14px; font-weight: 600; }
  .ring .win { color: var(--muted); font-size: .9rem; text-align: center; }
  .msg { padding: 14px 16px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; }
  .msg.ok { background: #dcfce7; color: #14532d; }
  .msg.warn { background: #ffedd5; color: #7c2d12; }
  .msg.bad { background: #fee2e2; color: #7f1d1d; }
  .msg.info { background: #dbeafe; color: #1e3a8a; }
  .msg small { display: block; font-weight: 500; margin-top: 4px; opacity: .85; }
  .btn { display: block; width: 100%; padding: 15px; border-radius: 12px; border: 0; font-size: 1.05rem; font-weight: 700; cursor: pointer; }
  .btn.dark { background: var(--dark); color: #fff; }
  .btn.light { background: var(--card); border: 2px solid var(--dark); color: var(--dark); }
  .btn.blue { background: var(--blue); color: #fff; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  label { display: block; font-size: .9rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  input[type=date] { width: 100%; padding: 11px 12px; font-size: 1rem; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); }
  .field { margin-bottom: 12px; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: -6px; margin-bottom: 12px; }
  ul.stays { list-style: none; margin: 0; padding: 0; }
  ul.stays li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); gap: 10px; }
  ul.stays li:first-child { border-top: 0; }
  ul.stays .d { font-weight: 600; }
  ul.stays .n { color: var(--muted); font-size: .9rem; }
  ul.stays button { background: none; border: 0; color: var(--red); font-size: 1.3rem; cursor: pointer; padding: 4px 8px; }
  .empty { color: var(--muted); font-style: italic; }
  ul.plans { margin-top: 14px; }
  ul.plans li { flex-direction: column; align-items: stretch; }
  ul.plans .top { display: flex; justify-content: space-between; align-items: center; }
  ul.plans .top .acts { display: flex; gap: 4px; }
  ul.plans .top .acts button.done { color: var(--green); font-size: 1rem; font-weight: 700; }
  ul.plans .msg { margin: 8px 0 0; padding: 10px 12px; font-size: .95rem; }
  .foot { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🇽🇰 → 🇨🇭 <span data-t="title"></span></h1>
    <div class="lang">
      <button id="lang-sq" onclick="setLang('sq')">SQ</button>
      <button id="lang-fr" onclick="setLang('fr')">FR</button>
    </div>
  </header>

  <section class="card ring">
    <div class="big" id="remaining">90</div>
    <div class="sub" data-t="remainingLabel"></div>
    <div class="used" id="usedLine"></div>
    <div class="win" id="windowLine"></div>
  </section>

  <div id="messages"></div>

  <div id="quick" class="row" style="margin-bottom:14px"></div>

  <section class="card">
    <h2 data-t="addTitle"></h2>
    <div class="field">
      <label for="entry" data-t="entryLabel"></label>
      <input type="date" id="entry">
    </div>
    <div class="field">
      <label for="exit" data-t="exitLabel"></label>
      <input type="date" id="exit">
    </div>
    <div class="hint" data-t="exitHint"></div>
    <div id="formError" class="msg bad" style="display:none"></div>
    <button class="btn dark" onclick="addStay()" data-t="addBtn"></button>
  </section>

  <section class="card">
    <h2 data-t="listTitle"></h2>
    <ul class="stays" id="list"></ul>
  </section>

  <section class="card">
    <h2 data-t="planTitle"></h2>
    <div class="hint" data-t="planIntro" style="margin-top:0"></div>
    <div class="row">
      <div class="field">
        <label for="planEntry" data-t="planEntry"></label>
        <input type="date" id="planEntry">
      </div>
      <div class="field">
        <label for="planExit" data-t="planExit"></label>
        <input type="date" id="planExit">
      </div>
    </div>
    <div class="hint" data-t="planExitHint"></div>
    <div id="planError" class="msg bad" style="display:none"></div>
    <button class="btn blue" onclick="addPlan()" data-t="planAdd"></button>
    <ul class="stays plans" id="plans"></ul>
  </section>

  <p class="foot" data-t="foot"></p>
</main>

<script>
/* ---------- Traductions ---------- */
const T = {
  sq: {
    title: "Sa ditë në Zvicër?",
    remainingLabel: "ditë të mbetura",
    used: "{u} nga 90 ditë të përdorura",
    window: "180 ditët e fundit: {a} – {b}",
    inside: "Je në Zvicër që nga {d}.",
    mustLeave: "Duhet të dalësh më së voni më {d} (edhe {n} ditë).",
    mustLeaveNow: "Duhet të dalësh SOT — nuk ke më ditë të mbetura.",
    canEnter: "Nëse hyn sot, mund të qëndrosh deri më {d} ({n} ditë).",
    cannotEnter: "Sot nuk mund të hysh. Hyrja e parë e mundshme: {d}.",
    fullReset: "Të 90 ditët e plota i ke sërish më {d}.",
    over: "⚠️ Kufiri 90/180 është tejkaluar që më {d} ({n} ditë tepër).",
    arrivedToday: "⬇︎ Arrita sot në Zvicër",
    leftToday: "⬆︎ U ktheva sot në Kosovë",
    addTitle: "Shto një qëndrim",
    entryLabel: "Arritja në Zvicër",
    exitLabel: "Kthimi në Kosovë",
    exitHint: "Lëre bosh nëse je ende në Zvicër.",
    addBtn: "Shto",
    listTitle: "Qëndrimet e regjistruara",
    empty: "Ende asnjë qëndrim. Shto arritjet e fundit që llogaritja të jetë e saktë.",
    stillHere: "ende në Zvicër",
    days: "{n} ditë",
    planTitle: "Planifiko udhëtimet e ardhshme",
    planIntro: "Shto udhëtimet që ke ndër mend. Çdo udhëtim llogaritet duke marrë parasysh të mëparshmit.",
    planEntry: "Arritja e planifikuar",
    planExit: "Kthimi i planifikuar",
    planExitHint: "Lëre bosh kthimin për të parë sa gjatë mund të qëndrosh (atëherë ky udhëtim nuk llogaritet për të tjerët).",
    planAdd: "Shto udhëtimin",
    planEmpty: "Asnjë udhëtim i planifikuar.",
    planArrive: "Në arritje më {d}: {n} ditë në dispozicion — mund të qëndrosh deri më {e}.",
    planOkExit: "✅ Në rregull ({t} ditë). Kur kthehesh më {d}, të mbeten edhe {n} ditë.",
    planOver: "⛔ Tejkalon me {n} ditë — duhet të dalësh më së voni më {d}.",
    planNo: "⛔ Më {d} nuk mund të hysh. Hyrja e parë e mundshme: {e}.",
    planDone: "✔ U krye",
    confirmDone: "Ta regjistroj këtë udhëtim si të kryer?",
    errPlanPast: "Data e arritjes duhet të jetë sot ose më vonë.",
    errEntry: "Shkruaj datën e arritjes.",
    errOrder: "Data e kthimit është para datës së arritjes.",
    errOpen: "Ke tashmë një qëndrim të hapur. Mbylle atë më parë.",
    errFuture: "Data e arritjes është në të ardhmen. Përdor pjesën « Planifiko ».",
    confirmDel: "Ta fshij këtë qëndrim?",
    foot: "Rregulli: maksimumi 90 ditë brenda çdo periudhe prej 180 ditësh (neni 6 §1, Kodi i Kufijve Schengen). Dita e hyrjes dhe dita e daljes numërohen të plota. Të dhënat ruhen vetëm në këtë pajisje.",
    locale: "sq-AL",
  },
  fr: {
    title: "Combien de jours en Suisse ?",
    remainingLabel: "jours restants",
    used: "{u} jours sur 90 utilisés",
    window: "180 derniers jours : {a} – {b}",
    inside: "Tu es en Suisse depuis le {d}.",
    mustLeave: "Tu dois sortir au plus tard le {d} (encore {n} jours).",
    mustLeaveNow: "Tu dois sortir AUJOURD'HUI — plus aucun jour restant.",
    canEnter: "Si tu entres aujourd'hui, tu peux rester jusqu'au {d} ({n} jours).",
    cannotEnter: "Tu ne peux pas entrer aujourd'hui. Première entrée possible : {d}.",
    fullReset: "Tu retrouves tes 90 jours complets le {d}.",
    over: "⚠️ La limite 90/180 est dépassée depuis le {d} ({n} jours de trop).",
    arrivedToday: "⬇︎ Arrivé en Suisse aujourd'hui",
    leftToday: "⬆︎ Rentré au Kosovo aujourd'hui",
    addTitle: "Ajouter un séjour",
    entryLabel: "Arrivée en Suisse",
    exitLabel: "Retour au Kosovo",
    exitHint: "Laisse vide si tu es encore en Suisse.",
    addBtn: "Ajouter",
    listTitle: "Séjours enregistrés",
    empty: "Aucun séjour pour l'instant. Ajoute tes dernières arrivées pour un calcul exact.",
    stillHere: "encore en Suisse",
    days: "{n} jours",
    planTitle: "Planifier les prochains voyages",
    planIntro: "Ajoute les voyages que tu prévois. Chaque voyage est calculé en tenant compte des précédents.",
    planEntry: "Arrivée prévue",
    planExit: "Retour prévu",
    planExitHint: "Laisse le retour vide pour voir combien de temps tu peux rester (ce voyage n'est alors pas compté pour les suivants).",
    planAdd: "Ajouter le voyage",
    planEmpty: "Aucun voyage planifié.",
    planArrive: "À l'arrivée le {d} : {n} jours disponibles — tu peux rester jusqu'au {e}.",
    planOkExit: "✅ OK ({t} jours). À ton retour le {d}, il te restera encore {n} jours.",
    planOver: "⛔ Dépasse de {n} jours — tu dois sortir au plus tard le {d}.",
    planNo: "⛔ Le {d}, tu ne peux pas entrer. Première entrée possible : {e}.",
    planDone: "✔ Réalisé",
    confirmDone: "Enregistrer ce voyage comme réalisé ?",
    errPlanPast: "La date d'arrivée doit être aujourd'hui ou plus tard.",
    errEntry: "Indique la date d'arrivée.",
    errOrder: "La date de retour est avant la date d'arrivée.",
    errOpen: "Tu as déjà un séjour en cours. Termine-le d'abord.",
    errFuture: "La date d'arrivée est dans le futur. Utilise la partie « Planifier ».",
    confirmDel: "Supprimer ce séjour ?",
    foot: "Règle : maximum 90 jours sur toute période de 180 jours (art. 6 §1, code frontières Schengen). Le jour d'entrée et le jour de sortie comptent en entier. Les données restent uniquement sur cet appareil.",
    locale: "fr-CH",
  },
};
let lang = localStorage.getItem("sa-dite-lang") || "sq";
const t = (k, v = {}) => (T[lang][k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x]);
// Pluriel français : « 1 jour » / « 2 jours » (invariable en albanais).
const tj = (k, v) => lang === "fr" ? t(k, v).replace(/\b1 jours\b/g, "1 jour") : t(k, v);

/* ---------- Dates (format ISO « YYYY-MM-DD », calcul en UTC pour éviter tout décalage) ---------- */
const DAY = 86400000;
const toUTC = (iso) => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const fromUTC = (ms) => new Date(ms).toISOString().slice(0, 10);
const addDays = (iso, n) => fromUTC(toUTC(iso) + n * DAY);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const fmt = (iso) => { const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; };
const isIso = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || "");

/* ---------- Règle 90/180 ---------- */
const MAX = 90, WINDOW = 180, LIMIT = 400;

// Ensemble des jours de présence distincts entre from et to (inclus).
function presence(stays, from, to) {
  const set = new Set();
  for (const s of stays) {
    const exit = s.exit || to;
    if (exit < s.entry) continue;
    const start = s.entry > from ? s.entry : from;
    const end = exit < to ? exit : to;
    for (let d = start; d <= end; d = addDays(d, 1)) set.add(d);
  }
  return set;
}
const usedOn = (stays, day) => presence(stays, addDays(day, -(WINDOW - 1)), day).size;
const remainingOn = (stays, day) => Math.max(0, MAX - usedOn(stays, day));
const openStay = (stays, day) => stays.find((s) => !s.exit && s.entry <= day) || null;

// Dernier jour autorisé pour un séjour en cours.
function mustLeaveBy(stays, day) {
  const open = openStay(stays, day);
  if (!open) return null;
  let last = open.entry;
  for (let i = 0; i < LIMIT; i++) {
    const c = addDays(open.entry, i);
    if (usedOn(stays, c) > MAX) break;
    last = c;
  }
  return last;
}

// Séjour maximal possible en entrant le jour `entry`.
function maxStayFrom(stays, entry) {
  let days = 0, lastExit = addDays(entry, -1);
  for (let i = 0; i < LIMIT; i++) {
    const c = addDays(entry, i);
    if (usedOn([...stays, { entry, exit: c }], c) > MAX) break;
    days = i + 1; lastExit = c;
  }
  return { days, lastExit };
}
function earliestReentry(stays, from) {
  for (let i = 0; i < LIMIT; i++) { const d = addDays(from, i); if (remainingOn(stays, d) >= 1) return d; }
  return addDays(from, LIMIT);
}
function fullReset(stays, from) {
  for (let i = 0; i < LIMIT; i++) { const d = addDays(from, i); if (usedOn(stays, d) === 0) return d; }
  return addDays(from, LIMIT);
}
function firstOverflow(stays, upTo) {
  let first = null, over = 0;
  for (const d of [...presence(stays, "1900-01-01", upTo)].sort()) {
    const ex = usedOn(stays, d) - MAX;
    if (ex > 0) { if (!first) first = d; over = Math.max(over, ex); }
  }
  return first ? { date: first, over } : null;
}

/* ---------- Données ---------- */
const KEY = "sa-dite-stays";
let stays = [];
try { stays = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { stays = []; }
const save = () => localStorage.setItem(KEY, JSON.stringify(stays));
const PKEY = "sa-dite-plans";
let plans = [];
try { plans = JSON.parse(localStorage.getItem(PKEY) || "[]"); } catch { plans = []; }
const savePlans = () => localStorage.setItem(PKEY, JSON.stringify(plans));
const sortByEntry = (arr) => arr.sort((a, b) => (a.entry < b.entry ? -1 : 1));

// Séjours réels « fermés » : un séjour encore ouvert est supposé se terminer aujourd'hui.
const closedStays = () => stays.map((s) => (s.exit ? s : { ...s, exit: today() }));

// Évalue chaque voyage planifié, dans l'ordre, en tenant compte des précédents.
function evalPlans() {
  const acc = closedStays();
  const out = [];
  for (const p of sortByEntry([...plans])) {
    const m = maxStayFrom(acc, p.entry);
    const r = { plan: p, avail: m.days, lastExit: m.lastExit, ok: m.days > 0 };
    if (m.days === 0) r.earliest = earliestReentry(acc, p.entry);
    if (p.exit && m.days > 0) {
      r.tripDays = Math.round((toUTC(p.exit) - toUTC(p.entry)) / DAY) + 1;
      r.over = Math.max(0, r.tripDays - m.days);
      r.ok = r.over === 0;
      if (r.ok) r.remainingAfter = remainingOn([...acc, { entry: p.entry, exit: p.exit }], p.exit);
    }
    // Un voyage sans date de retour est une simple question (« jusqu'à quand ? ») :
    // il n'est pas compté pour les voyages suivants ni pour le tableau de disponibilité.
    if (p.exit && m.days > 0) acc.push({ entry: p.entry, exit: r.ok ? p.exit : m.lastExit });
    out.push(r);
  }
  return { results: out, all: acc };
}

function addPlan() {
  const err = document.getElementById("planError");
  const entry = document.getElementById("planEntry").value;
  const exit = document.getElementById("planExit").value || null;
  let msg = null;
  if (!isIso(entry)) msg = t("errEntry");
  else if (entry < today()) msg = t("errPlanPast");
  else if (exit && exit < entry) msg = t("errOrder");
  if (msg) { err.textContent = msg; err.style.display = "block"; return; }
  err.style.display = "none";
  plans.push({ id: Date.now().toString(36), entry, exit });
  sortByEntry(plans); savePlans();
  document.getElementById("planEntry").value = ""; document.getElementById("planExit").value = "";
  render();
}
function delPlan(id) {
  if (!confirm(t("confirmDel"))) return;
  plans = plans.filter((p) => p.id !== id); savePlans(); render();
}
// Transforme un voyage planifié en séjour réel (retour futur ou absent → séjour encore ouvert).
function donePlan(id) {
  const p = plans.find((x) => x.id === id);
  if (!p || !confirm(t("confirmDone"))) return;
  const now = today();
  const exit = p.exit && p.exit <= now ? p.exit : null;
  if (!exit && openStay(stays, now)) { alert(t("errOpen")); return; }
  stays.push({ id: Date.now().toString(36), entry: p.entry > now ? now : p.entry, exit });
  stays.sort((a, b) => (a.entry < b.entry ? 1 : -1)); save();
  plans = plans.filter((x) => x.id !== id); savePlans(); render();
}

function setLang(l) { lang = l; localStorage.setItem("sa-dite-lang", l); document.documentElement.lang = l; render(); }

function addStay(entry, exit) {
  const err = document.getElementById("formError");
  const fromForm = entry === undefined;
  if (fromForm) { entry = document.getElementById("entry").value; exit = document.getElementById("exit").value || null; }
  const now = today();
  let msg = null;
  if (!isIso(entry)) msg = t("errEntry");
  else if (entry > now) msg = t("errFuture");
  else if (exit && exit < entry) msg = t("errOrder");
  else if (!exit && openStay(stays, now)) msg = t("errOpen");
  if (msg) { err.textContent = msg; err.style.display = "block"; return; }
  err.style.display = "none";
  stays.push({ id: Date.now().toString(36), entry, exit: exit || null });
  stays.sort((a, b) => (a.entry < b.entry ? 1 : -1));
  save();
  if (fromForm) { document.getElementById("entry").value = ""; document.getElementById("exit").value = ""; }
  render();
}
function closeStay() {
  const open = openStay(stays, today());
  if (open) { open.exit = today(); save(); render(); }
}
function delStay(id) {
  if (!confirm(t("confirmDel"))) return;
  stays = stays.filter((s) => s.id !== id); save(); render();
}

/* ---------- Affichage ---------- */
function render() {
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  document.getElementById("lang-sq").classList.toggle("on", lang === "sq");
  document.getElementById("lang-fr").classList.toggle("on", lang === "fr");
  document.title = t("title");

  const now = today();
  const used = usedOn(stays, now);
  const remaining = Math.max(0, MAX - used);
  const big = document.getElementById("remaining");
  big.textContent = remaining;
  big.style.color = remaining > 30 ? "var(--green)" : remaining > 10 ? "var(--orange)" : "var(--red)";
  document.getElementById("usedLine").textContent = t("used", { u: used });
  document.getElementById("windowLine").textContent = t("window", { a: fmt(addDays(now, -(WINDOW - 1))), b: fmt(now) });

  // Messages d'état
  const msgs = [];
  const over = firstOverflow(stays, now);
  if (over) msgs.push(`<div class="msg bad">${t("over", { d: fmt(over.date), n: over.over })}</div>`);
  const open = openStay(stays, now);
  if (open) {
    const leave = mustLeaveBy(stays, now);
    const left = Math.round((toUTC(leave) - toUTC(now)) / DAY);
    const cls = left > 10 ? "ok" : left > 0 ? "warn" : "bad";
    msgs.push(`<div class="msg ${cls}">${t("inside", { d: fmt(open.entry) })}<small>${left > 0 ? tj("mustLeave", { d: fmt(leave), n: left }) : t("mustLeaveNow")}</small></div>`);
  } else {
    const m = maxStayFrom(stays, now);
    if (m.days > 0) msgs.push(`<div class="msg ${m.days > 30 ? "ok" : "warn"}">✅ ${tj("canEnter", { d: fmt(m.lastExit), n: m.days })}</div>`);
    else msgs.push(`<div class="msg bad">⛔ ${t("cannotEnter", { d: fmt(earliestReentry(stays, now)) })}</div>`);
  }
  if (used > 0 && !open) msgs.push(`<div class="msg info">🔄 ${t("fullReset", { d: fmt(fullReset(stays, now)) })}</div>`);
  document.getElementById("messages").innerHTML = msgs.join("");

  // Boutons rapides
  document.getElementById("quick").innerHTML = open
    ? `<button class="btn light" onclick="closeStay()">${t("leftToday")}</button>`
    : `<button class="btn dark" onclick="addStay('${now}', null)">${t("arrivedToday")}</button>`;

  // Liste
  const list = document.getElementById("list");
  if (!stays.length) list.innerHTML = `<li class="empty">${t("empty")}</li>`;
  else list.innerHTML = stays.map((s) => {
    const n = Math.round((toUTC(s.exit || now) - toUTC(s.entry)) / DAY) + 1;
    return `<li><div><div class="d">${fmt(s.entry)} → ${s.exit ? fmt(s.exit) : t("stillHere")}</div><div class="n">${tj("days", { n })}</div></div><button title="✕" onclick="delStay('${s.id}')">✕</button></li>`;
  }).join("");

  // Voyages planifiés (calcul en chaîne)
  document.getElementById("planEntry").min = now;
  document.getElementById("planExit").min = now;
  const ev = evalPlans();
  const pl = document.getElementById("plans");
  if (!ev.results.length) pl.innerHTML = `<li class="empty">${t("planEmpty")}</li>`;
  else pl.innerHTML = ev.results.map((r) => {
    const p = r.plan;
    let body;
    if (r.avail === 0) body = `<div class="msg bad">${t("planNo", { d: fmt(p.entry), e: fmt(r.earliest) })}</div>`;
    else {
      body = `<div class="msg info">${tj("planArrive", { d: fmt(p.entry), n: r.avail, e: fmt(r.lastExit) })}</div>`;
      if (p.exit) body += r.ok
        ? `<div class="msg ok">${tj("planOkExit", { t: r.tripDays, d: fmt(p.exit), n: r.remainingAfter })}</div>`
        : `<div class="msg bad">${tj("planOver", { n: r.over, d: fmt(r.lastExit) })}</div>`;
    }
    return `<li><div class="top"><div class="d">${fmt(p.entry)} → ${p.exit ? fmt(p.exit) : "?"}</div><div class="acts">${p.entry <= now ? `<button class="done" onclick="donePlan('${p.id}')">${t("planDone")}</button>` : ""}<button onclick="delPlan('${p.id}')">✕</button></div></div>${body}</li>`;
  }).join("");
}

document.documentElement.lang = lang;
render();
</script>
</body>
</html>
